:root{--bg:#f7f6f2;--paper:#fffefa;--side:#eeede7;--ink:#30332e;--muted:#73776c;--line:#e2e3d9;--olive:#626f43;--light:#e9eddc;--red:#a35541;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px}button:hover{background:var(--light)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8d9a68;outline-offset:3px}input,textarea,select{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px;max-width:100%}textarea{resize:vertical;width:100%}.primary{background:var(--olive);color:white;border-color:var(--olive)}.primary:hover{background:#4d5934}.subtle{color:var(--muted)}.badge{display:inline-block;font-size:11px;letter-spacing:.03em;border-radius:5px;background:var(--light);color:#536039;padding:3px 6px}.demo{padding:7px 20px;background:#e9e5d9;font-size:12px;text-align:center;color:#635d4e}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:850px}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:20px}.logo{font-size:25px;font-weight:700;letter-spacing:-1px;padding:0 10px}.logo span{color:var(--olive)}.caption{text-transform:uppercase;font-size:10px;font-weight:650;letter-spacing:.12em;color:var(--muted);margin:20px 10px 8px}.nav{display:grid;gap:3px}.nav button{text-align:left;border:0;display:flex;gap:10px;align-items:center;padding:9px 12px}.nav button.active{background:#dfe5d2;color:#465530;font-weight:600}.nav button small{margin-left:auto;color:var(--muted)}.scope{width:100%;font-weight:600}.sidebar footer{margin-top:auto;padding:15px 10px 0;color:var(--muted);font-size:12px}.workspace{min-width:0}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 34px;gap:12px}.crumb{font-size:12px;color:var(--muted)}.avatar{width:27px;height:27px;border-radius:50%;background:#ded9cc;display:inline-grid;place-items:center;font-size:11px}.tools{display:flex;gap:8px;align-items:center}.content{max-width:1120px;margin:auto;padding:34px 42px 60px}.eyebrow{font-size:12px;color:var(--olive);font-weight:600}.heading{display:flex;justify-content:space-between;align-items:start;gap:14px;margin-bottom:27px}h1{font-size:30px;letter-spacing:-1px;font-weight:650;margin:4px 0 7px}h2{font-size:16px;margin:0 0 14px}h3{font-size:13px;margin:0}p{margin:7px 0 15px}.intro{color:var(--muted);font-size:13px}.summary{display:flex;gap:28px;border-bottom:1px solid var(--line);padding-bottom:23px;margin-bottom:25px}.summary strong{font-size:23px;font-weight:550;display:block}.summary span{font-size:12px;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-title h2{margin:0}.task{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 5px}.task .open{border:0;padding:0;text-align:left;flex:1;min-width:0;background:none}.task .title{display:block;font-weight:500}.meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.check{width:19px;height:19px;padding:0;border-radius:6px;flex:none;background:var(--paper)}.check.done{background:var(--olive);color:white}.task.completed .title{text-decoration:line-through;color:var(--muted)}.due{font-size:11px;color:var(--red);white-space:nowrap}.flag{color:var(--red);background:#f4e9e3;font-size:11px;padding:3px 6px;border-radius:5px}.pill{border-radius:20px;background:#eceee5;font-size:11px;padding:3px 8px}.callout{background:#eeefe6;border:1px solid #dde1cf;padding:17px 20px;border-radius:var(--radius);margin:23px 0}.callout p{font-size:12px;color:#646c55;margin-bottom:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.quick{display:flex;gap:8px;margin-bottom:26px}.quick input{flex:1;min-width:0}.tabs{display:flex;gap:3px;background:#eaece3;padding:3px;border-radius:8px}.tabs button{border:0;font-size:12px}.tabs .active{background:var(--paper);box-shadow:0 1px 3px #0001}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:22px}.column{background:#eeefe9;border-radius:10px;padding:12px;min-height:330px}.column h3{margin-bottom:15px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:13px;margin-bottom:9px;box-shadow:0 2px 4px #30332e04}.card .open{border:0;padding:0;text-align:left;width:100%;font-weight:500}.card select{font-size:11px;padding:3px;width:100%;margin-top:13px}.panel{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:100%;background:var(--paper);z-index:20;box-shadow:-15px 0 60px #28302120;overflow:auto;padding:25px}.panel[hidden],.shade[hidden]{display:none}.shade{position:fixed;inset:0;background:#2e332a30;z-index:19}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.panel h2{font-size:22px;line-height:1.3;letter-spacing:-.5px}.field{display:grid;gap:5px;margin:16px 0}.field label{font-size:12px;color:var(--muted)}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel .field-pair .field{min-width:0}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.proposal{padding:14px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.proposal label{display:flex;gap:9px;align-items:start}.proposal p{margin:6px 0 0 24px;font-size:12px;color:var(--muted)}.empty{text-align:center;border:1px dashed #c9cdbf;border-radius:12px;padding:35px 15px;color:var(--muted);margin-top:20px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.settings{max-width:650px}.setting{padding:20px 0;border-bottom:1px solid var(--line)}.setting p{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:10px;z-index:40;box-shadow:0 5px 20px #0002;font-size:13px;max-width:90%}.toast:empty{display:none}.progress{height:5px;background:#e0e4d5;border-radius:5px;margin:16px 0}.progress span{display:block;width:25%;height:100%;background:var(--olive);border-radius:5px}.mobile-menu{display:none}.menu-close{display:none}.warning{background:#fbf0df;border:1px solid #e8d4ae;border-radius:8px;padding:12px;font-size:12px}.state-picker{margin-top:35px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.state-picker select{font-size:11px;padding:4px}a{color:var(--olive)}@media(min-width:1450px){.content{padding-top:45px}.shell{min-height:900px}}@media(max-width:760px){.shell{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:20px 10px}.content{padding:24px}.topbar{padding:0 24px}.board{gap:8px}.column{padding:8px}.summary{gap:22px}}@media(max-width:580px){.shell{display:block;min-height:820px}.sidebar{display:none;position:absolute;top:62px;left:0;z-index:15;width:235px;min-height:700px;box-shadow:10px 0 30px #0002}.sidebar.visible{display:flex;position:fixed;top:0;bottom:0;min-height:0;overflow:auto}.menu-close{display:block;position:absolute;top:12px;right:12px;z-index:1;background:var(--side)}.sidebar .logo{padding-right:38px}.mobile-menu{display:inline-block}.demo{font-size:10px;padding:6px 9px}.topbar{height:59px;padding:0 16px}.crumb{display:none}.content{padding:24px 18px 55px}h1{font-size:27px}.heading{margin-bottom:22px}.heading>.tools{flex-direction:column;align-items:end}.summary{gap:28px}.task{gap:10px}.due{max-width:65px;white-space:normal;text-align:right}.board{grid-template-columns:1fr}.column{min-height:100px}.panel{width:100%;padding:22px}.quick{flex-wrap:wrap}.quick input{flex-basis:65%}.state-picker{align-items:start}.tools button{font-size:12px}.field-pair{gap:8px}}
</style><body><div class="demo">MAKIETA INTERAKTYWNA · przykładowe dane · AI nie działa naprawdę · zmiany znikają po odświeżeniu</div><div class="shell"><aside class="sidebar" id="sidebar"><button class="menu-close" onclick="document.getElementById('sidebar').classList.remove('visible')" aria-label="Zamknij nawigację">×</button><div class="logo">tapet<span>·</span></div><div><label class="caption" for="scope">Przestrzeń</label><select id="scope" class="scope" onchange="changeScope(this.value)"><option>Praca</option><option>Życie</option><option>Projekty poboczne</option><option>Wszystkie</option></select></div><nav class="nav" aria-label="Główna nawigacja"><button data-view="inbox" onclick="nav('inbox')">▣ Skrzynka <small>2</small></button><button data-view="today" onclick="nav('today')">◉ Dzisiaj <small>3</small></button><button data-view="upcoming" onclick="nav('upcoming')">▦ Nadchodzące</button></nav><div><div class="caption">Projekty</div><nav class="nav" aria-label="Projekty"><button data-view="project" onclick="nav('project')">◌ <span id="projectNav">Nowa strona</span></button></nav><div class="caption">Rytm pracy</div><nav class="nav"><button data-view="sprint" onclick="nav('sprint')">⚑ Sprint</button></nav></div><nav class="nav" style="margin-top:auto"><button data-view="settings" onclick="nav('settings')">⚙ Ustawienia i eksport</button></nav><footer><span class="avatar">AK</span> &nbsp; Twoje miejsce na rzeczy<br><small>Spokojnie, po kolei.</small></footer></aside><div class="workspace"><header class="topbar"><button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('visible')" aria-label="Otwórz nawigację">☰</button><span class="crumb" id="crumb">Praca / Dzisiaj</span><div class="tools"><span class="badge">DEMO</span><button onclick="openAI()">✧ Asystent AI</button><span class="avatar" aria-label="Profil Aleksandra">AK</span></div></header><main class="content" id="main"></main></div></div><div class="shade" id="shade" hidden onclick="closePanel()"></div><section class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-label="Panel szczegółów" tabindex="-1"></section><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id), statuses=['Do zrobienia','W toku','Gotowe'];let view='today',scope='Praca',layout='list',current=null,lastFocus=null,aiStage=0,sprintActive=true,exampleState='normal';
let sprintSnapshot=[];let sprintName='Fundamenty nowej strony',sprintGoal='Przygotować spójny, dostępny widok projektu do testów z zespołem.',sprintStart='2026-10-19',sprintEnd='2026-10-30';
let tasks=[{id:1,title:'Dopracować widok projektu',project:'Nowa strona',space:'Praca',status:'W toku',plan:'2026-10-23',deadline:'2026-10-26',priority:'Wysoki',tags:'design, MVP',sprint:true,subs:[['Szkic listy zadań',true],['Stany pustych widoków',false]]},{id:2,title:'Zebrać feedback od zespołu',project:'Nowa strona',space:'Praca',status:'Do zrobienia',plan:'2026-10-23',deadline:'2026-10-23',priority:'Średni',tags:'research',sprint:true,blocked:'Czekam na dostępność Marty',subs:[]},{id:3,title:'Uporządkować notatki ze spotkania',project:'Operacje',space:'Praca',status:'Do zrobienia',plan:'2026-10-23',deadline:'',priority:'Niski',tags:'',sprint:true,subs:[]},{id:4,title:'Sprawdzić kontrast komponentów',project:'Nowa strona',space:'Praca',status:'Do zrobienia',plan:'2026-10-26',deadline:'2026-10-28',priority:'Średni',tags:'dostępność',sprint:true,subs:[]},{id:5,title:'Wysłać podsumowanie warsztatu',project:'Nowa strona',space:'Praca',status:'Gotowe',plan:'2026-10-22',deadline:'',priority:'Niski',tags:'',sprint:false,subs:[]},{id:6,title:'Pomysł na lepszy onboarding',project:'',space:'Praca',status:'Do zrobienia',plan:'',deadline:'',priority:'Brak',tags:'pomysł',sprint:false,subs:[]},{id:7,title:'Przejrzeć zapisany artykuł',project:'',space:'Życie',status:'Do zrobienia',plan:'',deadline:'',priority:'Brak',tags:'',sprint:false,subs:[]},{id:8,title:'Zaplanować weekend w górach',project:'Dom i odpoczynek',space:'Życie',status:'Do zrobienia',plan:'2026-10-23',deadline:'',priority:'Średni',tags:'odpoczynek',sprint:false,subs:[]},{id:9,title:'Naszkicować stronę portfolio',project:'Portfolio',space:'Projekty poboczne',status:'W toku',plan:'2026-10-23',deadline:'2026-10-30',priority:'Średni',tags:'design',sprint:false,subs:[]}];
tasks.forEach(t=>t.unprocessed=[6,7].includes(t.id));
tasks.forEach(t=>t.description=t.id===1?'Przygotować czytelny widok projektu do testów: wspólne dane listy i kanbanu, stany zadań i podstawowe interakcje. Uwzględnić dostępność klawiatury.':'');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const project=()=>scope==='Życie'?'Dom i odpoczynek':scope==='Projekty poboczne'?'Portfolio':'Nowa strona';const filtered=()=>tasks.filter(t=>scope==='Wszystkie'||t.space===scope);const date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'}):'Bez daty';
function toast(t){$('toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',4500)}
function nav(v){if(v==='project'&&scope==='Wszystkie'){scope='Praca';$('scope').value=scope}view=v;exampleState='normal';$('sidebar').classList.remove('visible');render()}function changeScope(s){scope=s;if(view==='project')view='today';render()}
function row(t){return `<div class="task ${t.status==='Gotowe'?'completed':''}"><button class="check ${t.status==='Gotowe'?'done':''}" aria-label="${t.status==='Gotowe'?'Przywróć':'Ukończ'}: ${esc(t.title)}" onclick="toggle(${t.id})">${t.status==='Gotowe'?'✓':''}</button><button class="open" onclick="openTask(${t.id})"><span class="title">${esc(t.title)}</span><span class="meta">${scope==='Wszystkie'?esc(t.space)+' · ':''}${esc(t.project||'Skrzynka')} <span>· ${esc(t.status)}</span>${view==='upcoming'?'<span>· Plan: '+date(t.plan)+' · Deadline: '+date(t.deadline)+'</span>':''}${t.subs.length?'<span>· '+t.subs.filter(x=>x[1]).length+'/'+t.subs.length+' podzadania</span>':''}</span></button>${view==='inbox'?'<button onclick="processTask('+t.id+')" aria-label="Przetwórz: '+esc(t.title)+'">Przetwórz</button>':''}${t.blocked?'<span class="flag" title="'+esc(t.blocked)+'">Blokada</span>':''}${t.deadline?'<span class="due">Do '+date(t.deadline)+'</span>':''}</div>`}
function list(ts){return ts.length?ts.map(row).join(''):'<div class="empty"><strong>Wszystko ma swoje miejsce</strong>Brak zadań w tym zakresie. Dodaj coś do skrzynki.</div>'}
function processTask(id){tasks.find(t=>t.id===id).unprocessed=false;render();toast('Zadanie przetworzone; projekt i daty bez zmian')}
function todaySections(ts){let groups=[['Zaległe deadline’y',t=>t.deadline&&t.deadline<'2026-10-23'],['Deadline dzisiaj',t=>t.deadline==='2026-10-23'],['Zaległy plan',t=>t.plan&&t.plan<'2026-10-23'],['Plan na dziś',t=>t.plan==='2026-10-23']];let remaining=[...ts],out='';for(let [title,test] of groups){let matches=remaining.filter(test);remaining=remaining.filter(t=>!test(t));if(matches.length)out+='<div class="section-title"><h2>'+title+'</h2></div>'+list(matches)}return out||list([])}
function completionIssue(t){return t.blocked?'Najpierw usuń blokadę: '+t.blocked:t.subs.some(s=>!s[1])?'Najpierw ukończ podzadania: '+t.subs.filter(s=>!s[1]).map(s=>s[0]).join(', '):''}
function toggle(id){let t=tasks.find(t=>t.id===id);if(t.status!=='Gotowe'&&completionIssue(t)){toast(completionIssue(t));return}t.status=t.status==='Gotowe'?'Do zrobienia':'Gotowe';if(t.status==='Gotowe')t.unprocessed=false;render();toast(t.status==='Gotowe'?'Zadanie ukończone w makiecie':'Zadanie przywrócone')}
function head(title,sub,extra=''){return `<div class="heading"><div><div class="eyebrow">${esc(scope)} <span class="subtle">/ ${scope==='Wszystkie'?'całe Twoje Tapet':'bieżąca przestrzeń'}</span></div><h1>${title}</h1><div class="intro">${sub}</div></div>${extra}</div>`}
function quick(){return `<form class="quick" onsubmit="addTask(event)"><input id="quickTitle" aria-label="Tytuł nowego zadania" placeholder="Co chcesz zapamiętać?" required maxlength="160"><button class="primary">+ Dodaj</button></form>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('projectNav').textContent=project();$('crumb').textContent=scope+' / '+({today:'Dzisiaj',inbox:'Skrzynka',upcoming:'Nadchodzące',project:project(),sprint:'Sprint',settings:'Ustawienia'}[view]);let ts=filtered(),out='';document.querySelector('[data-view="inbox"] small').textContent=ts.filter(t=>t.unprocessed&&t.status!=='Gotowe').length;document.querySelector('[data-view="today"] small').textContent=ts.filter(t=>t.status!=='Gotowe'&&((t.plan&&t.plan<='2026-10-23')||(t.deadline&&t.deadline<='2026-10-23'))).length;
if(view==='today'){let today=ts.filter(t=>t.status!=='Gotowe'&&((t.plan&&t.plan<='2026-10-23')||(t.deadline&&t.deadline<='2026-10-23')));out=head('Dzisiaj','Piątek, 23 października 2026 · przestrzeń na to, co ważne.',`<button onclick="nav('inbox');setTimeout(()=>$('quickTitle').focus(),0)">+ Nowe zadanie</button>`)+`<div class="summary"><div><strong>${today.filter(t=>t.status!=='Gotowe').length}</strong><span>do zrobienia</span></div><div><strong>${today.filter(t=>t.status==='Gotowe').length}</strong><span>ukończone</span></div><div><strong>${today.filter(t=>t.blocked).length}</strong><span>z blokadą</span></div></div><div class="section-title"><h2>Twój plan na dziś</h2><span class="subtle" style="font-size:12px">Plan ≠ deadline</span></div>`+todaySections(today)+`<div class="callout"><div class="row"><span>✧</span><strong class="grow">Mniej układania, więcej przestrzeni.</strong><button onclick="openAI()">Uporządkuj z AI</button></div><p>Zobacz przykładowe propozycje. Ty wybierasz, co zostaje zmienione.</p></div>`}
if(view==='inbox'){out=head('Skrzynka','Nieprzetworzone zadania. Projekt i daty nie usuwają ich ze Skrzynki.')+quick()+`<div class="section-title"><h2>Do uporządkowania</h2><span class="pill">${ts.filter(t=>t.unprocessed&&t.status!=='Gotowe').length}</span></div>`+list(ts.filter(t=>t.unprocessed&&t.status!=='Gotowe'))+`<p class="intro" style="margin-top:20px">Nowe wpisy trafiają do wybranej przestrzeni. W zakresie „Wszystkie” wybór przestrzeni następuje przy dodawaniu.</p>`}
if(view==='upcoming'){const future=t=>[t.plan,t.deadline].filter(d=>d>'2026-10-23').sort()[0];const upcoming=ts.filter(t=>t.status!=='Gotowe'&&future(t));const days=[...new Set(upcoming.map(future))].sort();out=head('Nadchodzące','Najwcześniejszy przyszły plan lub deadline · dzień scenariusza: 23 października 2026.')+(days.length?days.map(day=>`<div class="section-title"><h2>${new Date(day+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><span class="pill">Plan / deadline</span></div>`+list(upcoming.filter(t=>future(t)===day))).join(''):'<div class="empty"><strong>Przyszłe dni są wolne</strong>Brak otwartych zadań z przyszłym planem lub deadline’em.</div>')+'<p class="intro" style="margin-top:20px">Jedno zadanie pojawia się tylko raz, według najwcześniejszej przyszłej daty. Pokazujemy wszystkie przyszłe daty w tej demonstracji.</p>'}
if(view==='project'){let pts=ts.filter(t=>t.project===project());out=head(project(),'Projekt · '+(scope==='Wszystkie'?'Praca':scope)+' · lista i tablica korzystają z tych samych zadań.',`<div class="tabs" aria-label="Widok projektu"><button class="${layout==='list'?'active':''}" aria-pressed="${layout==='list'}" onclick="layout='list';render()">☷ Lista</button><button class="${layout==='board'?'active':''}" aria-pressed="${layout==='board'}" onclick="layout='board';render()">▥ Kanban</button></div>`)+`<div class="row"><span class="pill">${pts.length} zadań</span><span class="subtle">${pts.filter(t=>t.status==='Gotowe').length} ukończone</span><button style="margin-left:auto" onclick="newProjectTask()">+ Dodaj zadanie</button></div>`+(layout==='list'?'<div style="margin-top:20px">'+list(pts)+'</div>':'<div class="board">'+statuses.map(s=>`<div class="column"><h3>${s} · ${pts.filter(t=>t.status===s).length}</h3>${pts.filter(t=>t.status===s).map(t=>`<div class="card"><button class="open" onclick="openTask(${t.id})">${esc(t.title)}</button><div class="meta">${esc(t.priority)} priorytet · ${t.subs.filter(s=>s[1]).length}/${t.subs.length} podzadań ${t.blocked?' · ⊘ Blokada':''}</div><div class="meta">Plan: ${date(t.plan)} · Deadline: ${date(t.deadline)}</div><select aria-label="Status: ${esc(t.title)}" onchange="setStatus(${t.id},this.value)">${statuses.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<p class="intro">Brak zadań</p>'}</div>`).join('')+'</div>')}
if(view==='sprint'){const sprintTasks=sprintActive?ts.filter(t=>t.sprint):sprintSnapshot;out=head('Sprint','Jeden aktywny sprint w każdej przestrzeni. Wiele projektów, wspólny cel.');if(scope==='Wszystkie')out+='<div class="empty"><strong>Wybierz jedną przestrzeń</strong>Sprinty nie łączą przestrzeni.<p><button onclick="scope=\'Praca\';$(\'scope\').value=scope;render()">Przejdź do Pracy</button></p></div>';else if(scope!=='Praca')out+=`<div class="empty"><strong>Jeszcze bez sprintu</strong>Zacznij od celu i małego zakresu.<p><button class="primary" onclick="toast('Demo: tworzenie sprintu pokazano w przestrzeni Praca.');scope='Praca';$('scope').value=scope;render()">Zobacz przykład sprintu</button></p></div>`;else out+=`<div class="callout"><div class="row"><span class="badge">${sprintActive?'AKTYWNY':'ZAKOŃCZONY'}</span><span class="subtle">${date(sprintStart)} – ${date(sprintEnd)} 2026</span></div><h2 style="font-size:23px;margin:14px 0 5px">${esc(sprintName)}</h2><p>Cel: ${esc(sprintGoal)}</p><div class="progress"><span style="width:${Math.round(sprintTasks.filter(t=>t.status==='Gotowe').length/Math.max(1,sprintTasks.length)*100)}%"></span></div><div class="row"><span class="grow">${sprintTasks.filter(t=>t.status==='Gotowe').length}/${sprintTasks.length} gotowe · Nowa strona + Operacje</span><button onclick="sprintAction()">${sprintActive?'Zakończ sprint':'Rozpocznij kolejny'}</button></div></div><div class="section-title"><h2>${sprintActive?'Zakres sprintu':'Migawka zamknięcia'}</h2><span class="subtle">Praca</span></div>`+(sprintActive?list(sprintTasks):sprintTasks.map(t=>`<div class="task"><div class="grow">${esc(t.title)}<div class="meta">${esc(t.project)} · ${esc(t.status)}</div></div><span class="pill">Migawka</span></div>`).join(''))}
if(view==='settings'){out=head('Ustawienia','Kontrola nad AI i Twoimi danymi.')+`<div class="settings"><div class="setting"><h2>✧ Asystent AI</h2><span class="badge">TYLKO DEMONSTRACJA</span><p>Brak połączenia z modelem. Prompty i klucze nie są wysyłane. Wersja MVP pokaże podgląd każdej zmiany i poprosi o zatwierdzenie.</p><label class="row"><input type="checkbox" checked disabled> Wymagaj zatwierdzenia zmian <span class="subtle">(zawsze w MVP)</span></label><div class="field"><span class="subtle">Dostawca</span><strong>OpenAI · konfiguracja backendu</strong></div><p>Konfiguracja klucza API jest poza makietą. Nie wpisuj tu prawdziwych danych dostępowych.</p></div><div class="setting"><h2>Eksport</h2><p>Pobierz JSON z bieżącymi danymi demonstracyjnymi ze wszystkich przestrzeni.</p><button onclick="exportData()">↓ Eksportuj dane demo (.json)</button></div><div class="setting"><h2>O tej makiecie</h2><p>To design MVP, nie działająca aplikacja. Bez konta, backendu, synchronizacji i trwałego zapisu. Odświeżenie przywraca przykładowe dane.</p><button onclick="location.reload()">Przywróć makietę</button></div></div>`}
if(view!=='settings'){out+=`<div class="state-picker"><label for="state">Stany demonstracyjne tego widoku</label><select id="state" onchange="exampleState=this.value;render()"><option value="normal">Dane</option><option value="empty">Pusty</option><option value="loading">Ładowanie</option><option value="error">Błąd</option></select></div>`;if(exampleState!=='normal'){let states={empty:'<strong>Tu jest jeszcze spokojnie</strong>Brak zadań dla wybranego zakresu.',loading:'<strong>Przygotowujemy widok…</strong>Przykładowy stan ładowania. Żadne dane nie są pobierane.',error:'<strong>Nie udało się wczytać zadań</strong>Przykładowy błąd. Twoje dane pozostają bez zmian.'};out=head({today:'Dzisiaj',inbox:'Skrzynka',upcoming:'Nadchodzące',project:project(),sprint:'Sprint'}[view],'Podgląd stanu interfejsu')+`<div class="empty" ${exampleState==='loading'?'role="status"':''}>${states[exampleState]}<p><button onclick="exampleState='normal';render()">${exampleState==='error'?'Spróbuj ponownie':'Wróć do danych'}</button></p></div>`}}
$('main').innerHTML=out;}
function addTask(e){e.preventDefault();let title=$('quickTitle').value.trim();if(!title)return;if(scope==='Wszystkie'){showPanel(`<div class="panel-head"><h2>Gdzie to zapisać?</h2><button onclick="closePanel()" aria-label="Zamknij">×</button></div><p>${esc(title)}</p><div class="field"><label for="newSpace">Przestrzeń</label><select id="newSpace"><option>Praca</option><option>Życie</option><option>Projekty poboczne</option></select></div><button class="primary" id="confirmAdd">Dodaj do skrzynki</button>`);$('confirmAdd').onclick=()=>{createTask(title,$('newSpace').value);closePanel()}}else createTask(title,scope)}
function createTask(title,space,proj=''){let t={id:Date.now(),title,space,project:proj,unprocessed:true,status:statuses[0],plan:'',deadline:'',priority:'Brak',tags:'',sprint:false,subs:[]};tasks.push(t);render();toast('Dodano zadanie — tylko w tej sesji');return t}
function newProjectTask(){let t=createTask('Nowe zadanie',scope==='Wszystkie'?'Praca':scope,project());openTask(t.id)}
function setStatus(id,status){let t=tasks.find(t=>t.id===id);if(status==='Gotowe'&&completionIssue(t)){toast(completionIssue(t));render();return}t.status=status;if(status==='Gotowe')t.unprocessed=false;render();toast('Status zmieniony także w widoku listy')}
function showPanel(html){lastFocus=document.activeElement;$('panel').innerHTML=html;$('panel').hidden=false;$('shade').hidden=false;$('panel').focus()}
function closePanel(){$('panel').hidden=true;$('shade').hidden=true;lastFocus?.isConnected&&lastFocus.focus()}
function openTask(id){current=tasks.find(t=>t.id===id);let t=current;showPanel(`<div class="panel-head"><span class="badge">ZADANIE · ${esc(t.space)}</span><button onclick="closePanel()" aria-label="Zamknij szczegóły">×</button></div><h2>${esc(t.title)}</h2><p class="intro">Edytuj i zapisz zmiany w pamięci makiety.</p><form onsubmit="saveTask(event)"><div class="field"><label for="taskTitle">Tytuł</label><input id="taskTitle" value="${esc(t.title)}" required maxlength="160"></div><div class="field"><label for="taskDescription">Opis zadania</label><textarea id="taskDescription" rows="4" maxlength="10000" placeholder="Kontekst, oczekiwany wynik, kryteria ukończenia…">${esc(t.description)}</textarea></div><div class="field-pair"><div class="field"><label for="taskStatus">Status</label><select id="taskStatus">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="priority">Priorytet</label><select id="priority">${['Brak','Niski','Średni','Wysoki'].map(s=>`<option ${s===t.priority?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label for="taskProject">Projekt w przestrzeni ${esc(t.space)}</label><select id="taskProject">${['',...(t.space==='Praca'?['Nowa strona','Operacje']:t.space==='Życie'?['Dom i odpoczynek']:['Portfolio'])].map(s=>`<option value="${s}" ${s===t.project?'selected':''}>${s||'Bez projektu · Skrzynka'}</option>`).join('')}</select></div><div class="field-pair"><div class="field"><label for="plan">Planowany dzień</label><input id="plan" type="date" value="${t.plan}"></div><div class="field"><label for="deadline">Deadline</label><input id="deadline" type="date" value="${t.deadline}"></div></div><p class="intro">Dzień to plan pracy. Deadline to ostateczny termin.</p><div class="field"><label for="tags">Tagi · rozdziel przecinkiem</label><input id="tags" value="${esc(t.tags)}"></div><label class="row"><input type="checkbox" id="blocked" ${t.blocked?'checked':''} onchange="$('reason').required=this.checked"> Zadanie zablokowane</label><div class="field"><label for="reason">Powód blokady (wymagany przy blokadzie)</label><input id="reason" value="${esc(t.blocked)}" ${t.blocked?'required':''}></div><div class="field"><label for="taskSprint">Sprint</label><select id="taskSprint" ${t.space!=='Praca'||!sprintActive?'disabled':''}><option value="no">Bez sprintu</option>${t.space==='Praca'&&sprintActive?`<option value="yes" ${t.sprint?'selected':''}>${esc(sprintName)}</option>`:''}</select></div><hr class="divider"><h3>Podzadania</h3><p class="intro">Jeden poziom. Dziedziczą przestrzeń, projekt i sprint rodzica.</p><div id="subs">${t.subs.map((s,i)=>`<label class="row" style="margin:10px 0"><input class="subcheck" data-i="${i}" type="checkbox" ${s[1]?'checked':''}>${esc(s[0])}</label>`).join('')}</div><div class="field"><label for="newSub">Dodaj podzadanie przy zapisie</label><input id="newSub" placeholder="Następny mały krok" maxlength="120"></div>${t.status==='Gotowe'?'<label class="row" style="margin:16px 0"><input id="reopenParent" type="checkbox"> Otwórz również rodzica, jeśli dodaję lub otwieram podzadanie.</label>':''}<div class="row"><button class="primary" type="submit">Zapisz zmiany demo</button><button type="submit" name="process" value="yes">Zapisz i przetwórz</button></div></form>`)}
function saveTask(e){e.preventDefault();let t=current;let draft={...t,title:$('taskTitle').value.trim(),description:$('taskDescription').value,status:$('taskStatus').value,priority:$('priority').value,project:$('taskProject').value,plan:$('plan').value,deadline:$('deadline').value,tags:$('tags').value,blocked:$('blocked').checked?$('reason').value.trim():'',sprint:$('taskSprint').disabled?t.sprint:$('taskSprint').value==='yes',subs:t.subs.map(s=>[...s])};if(!draft.title)return;if($('blocked').checked&&!draft.blocked){$('reason').focus();return}document.querySelectorAll('.subcheck').forEach(c=>draft.subs[+c.dataset.i][1]=c.checked);if($('newSub').value.trim())draft.subs.push([$('newSub').value.trim(),false]);if(t.status==='Gotowe'&&draft.subs.some(s=>!s[1])){if(!$('reopenParent').checked){toast('Zaznacz „Otwórz również rodzica”, aby otworzyć lub dodać podzadanie');return}draft.status='Do zrobienia'}if(draft.status==='Gotowe'&&completionIssue(draft)){toast(completionIssue(draft));return}if(draft.sprint&&!t.sprint&&draft.status==='Gotowe'){toast('Gotowego zadania nie dodajemy do sprintu');return}if(draft.status==='Gotowe'||e.submitter?.name==='process')draft.unprocessed=false;Object.assign(t,draft);closePanel();render();toast(draft.plan&&draft.deadline&&draft.plan>draft.deadline?'Zapisano. Uwaga: planowany dzień jest po deadline.':'Zapisano zmiany demonstracyjne')}
function sprintAction(){if(!sprintActive){showPanel(`<div class="panel-head"><h2>Rozpocznij sprint</h2><button onclick="closePanel()" aria-label="Zamknij">×</button></div><p class="intro">Praca · zakres dobierzesz w szczegółach zadań z różnych projektów.</p><form onsubmit="startSprint(event)"><div class="field"><label for="sprintName">Nazwa</label><input id="sprintName" required value="Kolejny mały krok"></div><div class="field"><label for="sprintGoal">Cel</label><textarea id="sprintGoal" required rows="3">Przetestować widok projektu i zebrać wnioski.</textarea></div><div class="field-pair"><div class="field"><label for="sprintStart">Start</label><input id="sprintStart" required type="date" value="2026-11-02"></div><div class="field"><label for="sprintEnd">Koniec</label><input id="sprintEnd" required type="date" value="2026-11-13"></div></div><button class="primary">Rozpocznij sprint demo</button></form>`);return}showPanel(`<div class="panel-head"><h2>Zakończyć sprint?</h2><button onclick="closePanel()" aria-label="Zamknij">×</button></div><p>${tasks.filter(t=>t.sprint&&t.status==='Gotowe').length} gotowe · ${tasks.filter(t=>t.sprint&&t.status!=='Gotowe').length} niedokończone. Zachowamy niezmienną migawkę wyniku.</p><form onsubmit="finishSprint(event)"><label class="row"><input type="checkbox" required> Niedokończone zadania wracają do backlogu bez sprintu.</label><p class="intro">Projekt, plan i deadline pozostają bez zmian. Dziedziczące podzadania wracają wraz z rodzicem. Przenoszenie do innego sprintu jest poza tą demonstracją.</p><button class="primary">Potwierdź i zakończ sprint</button></form>`)}
function finishSprint(e){e.preventDefault();sprintSnapshot=JSON.parse(JSON.stringify(tasks.filter(t=>t.sprint)));sprintActive=false;tasks.filter(t=>t.space==='Praca').forEach(t=>t.sprint=false);closePanel();render();toast('Sprint zamknięty; wynik zapisany jako migawka demo')}
function startSprint(e){e.preventDefault();if($('sprintEnd').value<$('sprintStart').value){toast('Koniec sprintu musi przypadać po dniu startu lub tego samego dnia');$('sprintEnd').focus();return}sprintName=$('sprintName').value.trim();sprintGoal=$('sprintGoal').value.trim();if(!sprintName||!sprintGoal)return;sprintStart=$('sprintStart').value;sprintEnd=$('sprintEnd').value;sprintSnapshot=[];sprintActive=true;closePanel();render();toast('Sprint rozpoczęty; przypisz zadania w ich szczegółach')}
let aiSelection=[true,true],aiSnapshot='';function openAI(){aiStage=0;showPanel(`<div class="panel-head"><span class="badge">✧ ASYSTENT · DEMO</span><button onclick="closePanel()" aria-label="Zamknij asystenta">×</button></div><h2>Ułóż spokojniejszy dzień.</h2><p class="intro">Przykładowy scenariusz dla przestrzeni Praca. Brak prawdziwego AI i połączeń sieciowych.</p><div class="callout"><strong>Zakres: Praca</strong><p>Tylko zadania tej przestrzeni. Brak zmian bez Twojego zatwierdzenia.</p></div><label for="prompt">Co chcesz uporządkować?</label><textarea id="prompt" rows="4" style="margin:8px 0 15px">Przejrzyj mój plan na dziś. Przenieś mniej pilne rzeczy i rozbij duże zadanie na krok.</textarea><button class="primary" onclick="aiSelection=[true,true];aiSnapshot=JSON.stringify(tasks.filter(t=>[1,3].includes(t.id)));aiProposals()">Pokaż przykładowe propozycje</button><p class="intro" style="margin-top:18px">Tekst promptu nie zmienia gotowego scenariusza demo.</p>`)}
function aiProposals(){aiStage=1;setTimeout(()=>$('panel').focus(),0);$('panel').innerHTML=`<div class="panel-head"><span class="badge">✧ 1/2 · WYBÓR ZMIAN</span><button onclick="closePanel()" aria-label="Zamknij asystenta">×</button></div><h2>Dwie małe zmiany.</h2><p class="intro">Jawne przykłady, nie wynik analizy AI. Dotyczą przestrzeni Praca.</p><div class="proposal"><label><input type="checkbox" ${aiSelection[0]?'checked':''} onchange="aiSelection[0]=this.checked"><strong>Przełóż notatki na poniedziałek</strong></label><p>„Uporządkować notatki ze spotkania”<br>Plan: 23 paź → 26 paź<br>Deadline pozostaje bez zmian.</p></div><div class="proposal"><label><input type="checkbox" ${aiSelection[1]?'checked':''} onchange="aiSelection[1]=this.checked"><strong>Dodaj mały krok do projektu</strong></label><p>Do „Dopracować widok projektu”:<br>+ „Sprawdzić stany interaktywne”<br>Dziedziczy Praca / Nowa strona / sprint rodzica.</p></div><button class="primary" onclick="aiPreview()">Dalej: podgląd zmian</button><p><button onclick="openAI()">Wróć do promptu</button></p><hr class="divider"><button onclick="aiConflict()">Pokaż przykładowy konflikt</button><p class="intro">Stan, gdy dane zmieniły się od przygotowania propozycji.</p>`}
function aiPreview(){if(!aiSelection.some(Boolean)){toast('Wybierz przynajmniej jedną propozycję');return}aiStage=2;setTimeout(()=>$('panel').focus(),0);$('panel').innerHTML=`<div class="panel-head"><span class="badge">✧ 2/2 · PODGLĄD</span><button onclick="closePanel()" aria-label="Zamknij">×</button></div><h2>Tak zmieni się Twój plan.</h2><p class="intro">${aiSelection.filter(Boolean).length} wybrane zmiany · Praca</p>${aiSelection[0]?'<div class="proposal"><strong>Planowany dzień</strong><p>Uporządkować notatki ze spotkania<br><del>23 października</del> → <strong>26 października</strong></p></div>':''}${aiSelection[1]?'<div class="proposal"><strong>Nowe podzadanie</strong><p>Dopracować widok projektu<br>+ Sprawdzić stany interaktywne</p></div>':''}<p class="intro">Bez zmiany deadline’ów, statusów i przestrzeni.</p><button class="primary" onclick="acceptAI()">Zatwierdź wybrane zmiany demo</button><p><button onclick="aiProposals()">Wróć do wyboru</button></p>`}
function acceptAI(){if(JSON.stringify(tasks.filter(t=>[1,3].includes(t.id)))!==aiSnapshot){aiConflict();return}if(aiSelection[0])tasks.find(t=>t.id===3).plan='2026-10-26';if(aiSelection[1]){let t=tasks.find(t=>t.id===1);if(!t.subs.some(s=>s[0]==='Sprawdzić stany interaktywne'))t.subs.push(['Sprawdzić stany interaktywne',false])}closePanel();render();toast('Zatwierdzono wybrane propozycje — tylko w pamięci makiety')}
function aiConflict(){setTimeout(()=>$('panel').focus(),0);$('panel').innerHTML=`<div class="panel-head"><span class="badge">✧ KONFLIKT · PRZYKŁAD</span><button onclick="closePanel()" aria-label="Zamknij">×</button></div><h2>Najpierw odśwież propozycje.</h2><div class="warning">Zadanie zmieniło się od przygotowania podglądu. Nie zastosowano żadnej zmiany.</div><p class="intro">W tym scenariuszu pokazujemy ochronę przed nadpisaniem nowszych danych.</p><button class="primary" onclick="aiSnapshot=JSON.stringify(tasks.filter(t=>[1,3].includes(t.id)));aiProposals()">Wygeneruj ponownie (demo)</button>`}
function exportData(){let blob=new Blob([JSON.stringify({demo:true,tasks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tapet-dane-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Pobrano przykładowe dane JSON')}
document.addEventListener('keydown',e=>{if($('panel').hidden)return;if(e.key==='Escape'){e.preventDefault();closePanel()}if(e.key==='Tab'){let els=[...$('panel').querySelectorAll('button,input,select,textarea,[tabindex]')].filter(x=>!x.disabled);let first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('panel'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&(document.activeElement===last||!$('panel').contains(document.activeElement))){e.preventDefault();first?.focus()}}});render();
</script></body></html>
